<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neville's Solitaire</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-board">
    <h1 class="game-title">Neville's Solitaire</h1>

    <!-- Controls Bar -->
    <div class="controls-bar">
      <button id="restart-btn">Restart Game</button>
      <div id="timer">Time: 00:00</div>
    </div>

    <div class="top-row">
      <div class="deck-area">
        <div id="stock" class="pile card-back"></div>
        <div id="waste" class="pile"></div>
      </div>
      <div class="foundations">
        <div class="foundation pile" data-suit="hearts"></div>
        <div class="foundation pile" data-suit="diamonds"></div>
        <div class="foundation pile" data-suit="clubs"></div>
        <div class="foundation pile" data-suit="spades"></div>
      </div>
    </div>
    <div class="tableau">
      <div class="column pile" data-col="0"></div>
      <div class="column pile" data-col="1"></div>
      <div class="column pile" data-col="2"></div>
      <div class="column pile" data-col="3"></div>
      <div class="column pile" data-col="4"></div>
      <div class="column pile" data-col="5"></div>
      <div class="column pile" data-col="6"></div>
    </div>
  </div>

  <!-- Victory Overlay Banner -->
  <div id="win-modal" class="modal hidden">
    <div class="modal-content">
      <h2>🎉 Congratulations! 🎉</h2>
      <p>You solved the puzzle!</p>
      <button id="play-again-btn">Play Again?</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
